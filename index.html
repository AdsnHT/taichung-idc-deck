<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>東豐台中 IDC｜Web Deck</title>

  <style>
    :root{
      --bg:#fff;

      --fadeDur: 870ms;
      --entryDur: 1050ms;
      --ease: cubic-bezier(.2,.7,.2,1);

      --d-title: 220ms;
      --d-body:  400ms;
      --d-img:   620ms;

      --imgShift: 20px;

      /* ===== Slide 0：圈圈「最終對齊座標」只改這裡 =====
         這些值是以 stage(2000x1126) 的座標系為準
      */
      --s0-circle-left: 50%;
      --s0-circle-top:  210px;   /* 你在 DevTools 調好就填這裡 */
      --s0-circle-size: 720px;   /* 你在 DevTools 調好就填這裡 */

      /* 如果你需要微調圈圈內圖片裁切位置，可用 object-position */
      --s0-img-pos: 50% 50%;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:var(--bg);
      overflow:hidden;
      font-family: system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    }

    .deck{
      position:relative;
      width:100%;
      height:100%;
      display:grid;
      place-items:center;
    }

    /* slide 疊層 cross-fade */
    .slide{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      opacity:0;
      pointer-events:none;
      transition: opacity var(--fadeDur) var(--ease);
    }
    .slide.is-active{
      opacity:1;
      pointer-events:auto;
    }

    /* 舞台：像素級一致 + fit */
    .stage{
      position:absolute;
      left:50%;
      top:50%;
      transform-origin:center center;
    }
    .stage.fit{
      transform: translate(-50%, -50%) translateZ(0) scale(var(--scale, 1));
    }

    img{ position:absolute; left:0; top:0; image-rendering:auto; }
    .base{ width:100%; height:100%; }

    /* ===== 分段進場（Staggered Entry） ===== */
    .layer{
      opacity:0;
      transition:
        opacity var(--entryDur) var(--ease),
        transform var(--entryDur) var(--ease);
      will-change: opacity, transform;
    }
    .layer.title{ transform: translateY(8px); }
    .layer.body{  transform: translateY(8px); }
    .layer.image{ transform: translateX(var(--imgShift)) scale(.98); }

    .slide.is-active.is-enter .layer.title{
      opacity:1;
      transform: translateY(0);
      transition-delay: var(--d-title);
    }
    .slide.is-active.is-enter .layer.body{
      opacity:1;
      transform: translateY(0);
      transition-delay: var(--d-body);
    }
    .slide.is-active.is-enter .layer.image{
      opacity:1;
      transform: translateX(0) scale(1);
      transition-delay: var(--d-img);
    }

    /* ===== Slide 2~8 logo ===== */
    .logo-corner{
      position:absolute;
      left: 925px;
      top: 45px;
      width: 120px;
      height: auto;

      z-index: 5;
      pointer-events: none;

      opacity: 0;
      transform: translateY(4px);

      transition:
        opacity 900ms var(--ease),
        transform 900ms var(--ease);
      transition-delay: 400ms;
    }
    .slide.is-active.is-enter .logo-corner{
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== Slide 9 logo ===== */
    .logo-center-bottom{
      position:absolute;
      left: 50%;
      top: 920px;
      width: 110px;
      height: auto;

      z-index: 5;
      pointer-events: none;

      opacity: 0;
      transform: translateX(-50%) translateY(8px);

      transition:
        opacity 800ms var(--ease),
        transform 900ms var(--ease);
      transition-delay: 560ms;
    }
    .slide.is-active.is-enter .logo-center-bottom{
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =========================================================
       ✅ Slide 0 swap-circle（唯一一份定義，不重複）
       核心原則：定位鎖死（left/top/size），進場只改 opacity
       ========================================================= */
    .swap-circle{
      position:absolute;
      left: 50%;
      top:  120px;      /* 你可以留著或再微調 */
      width: 800px;
      height:800px;

      transform: translateX(-50%);
      border-radius: 0%;
      overflow:hidden;

      /* ✅拿掉白色圈效果 */
      background: transparent;
      box-shadow: none;

      z-index: 6;
      cursor: pointer;

      opacity:0;
      transition: opacity var(--entryDur) var(--ease);
      transition-delay: 180ms;
    }

    /* 只讓它淡入，不改 transform（避免對齊好的位置被覆蓋） */
    .slide.is-active.is-enter .swap-circle{
      opacity:1;
    }

    /* 圓內圖片 */
    .swap-circle img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
      transition: opacity 380ms var(--ease);
    }

    /* 預設：底圖顯示、hover圖隱藏 */
    .swap-circle img:not(.swap-hover){ opacity:1; }
    .swap-circle .swap-hover{ opacity:0; }

    /* hover：底圖淡出、hover圖淡入 */
    .swap-circle:hover img:not(.swap-hover){ opacity:0; }
    .swap-circle:hover .swap-hover{ opacity:1; }
    .swap-circle:active{
      transform: translateX(-50%) scale(0.985);
    }


    /* ===== 強制重播（不動定位，只重播透明度） ===== */
    .slide.replay-reset .layer,
    .slide.replay-reset .logo-corner,
    .slide.replay-reset .logo-center-bottom,
    .slide.replay-reset .swap-circle{
      transition: none !important;
      opacity: 0 !important;
    }
    .slide.replay-reset .layer.title{ transform: translateY(8px) !important; }
    .slide.replay-reset .layer.body { transform: translateY(8px) !important; }
    .slide.replay-reset .layer.image{ transform: translateX(var(--imgShift)) scale(.98) !important; }
    .slide.replay-reset .logo-corner{ transform: translateY(4px) !important; }
    .slide.replay-reset .logo-center-bottom{ transform: translateX(-50%) translateY(8px) !important; }

    /* HUD */
    .hud{
      position:absolute;
      left:20px;
      right:20px;
      bottom:18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      z-index:10;
    }
    .hud .left{ display:flex; gap:10px; align-items:center; }

    button{
      appearance:none;
      border:1px solid rgba(0,0,0,.12);
      background:rgba(255,255,255,.92);
      border-radius:999px;

      height:40px;
      min-width:40px;
      padding:0 12px;

      font-size:14px;
      font-weight:600;
      cursor:pointer;

      color: rgba(0,0,0,.45);
      box-shadow:0 10px 26px rgba(0,0,0,.08);
      backdrop-filter: blur(10px);
    }
    button:active{ transform: translateY(1px); }

    .hint{
      font-size:13px;
      color: rgba(0,0,0,.22);
      user-select:none;
      white-space:nowrap;
      transform: translateY(4px);
    }

    @media (max-width: 860px){
      .hint{ display:none; }
    }

    @media (prefers-reduced-motion: reduce){
      :root{
        --fadeDur:2ms;
        --entryDur:2ms;
        --d-title:0ms;
        --d-body:0ms;
        --d-img:0ms;
      }
      .swap-circle img{ transition:none; }
    }
  </style>
</head>

<body>

    <!-- HUD -->
    <div class="hud">
      <div class="left">
        <button id="prevBtn" type="button" aria-label="Previous">←</button>
        <button id="nextBtn" type="button" aria-label="Next">→</button>
        <button id="autoBtn" type="button" aria-label="Auto Play">Auto</button>
      </div>
      <div class="hint">快捷鍵：Esc 停自動播放</div>

  <script>
    // Debug: 找出破圖是哪一張（只在 Console 看，不影響功能）
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("img").forEach(img => {
        img.addEventListener("error", () => {
          console.error("[IMG ERROR] 無法載入：", img.getAttribute("src"));
        });
      });
    });

    const slides = Array.from(document.querySelectorAll("[data-slide]"));
    let idx = 0;

    function applyFit(){
      const slide = slides[idx];
      const stage = slide.querySelector(".stage");
      if (!stage) return;

      stage.classList.remove("fit");

      const w = parseFloat(stage.style.width)  || stage.getBoundingClientRect().width;
      const h = parseFloat(stage.style.height) || stage.getBoundingClientRect().height;

      const vv = window.visualViewport;
      const vw = vv ? vv.width  : window.innerWidth;
      const vh = vv ? vv.height : window.innerHeight;

      const safeW = vw - 24;
      const safeH = vh - 92;

      const scale = Math.min(safeW / w, safeH / h);
      stage.style.setProperty("--scale", scale.toFixed(6));
      stage.classList.add("fit");
    }

    function replayCurrentSlide(){
      const cur = slides[idx];
      if (!cur) return;

      cur.classList.remove("is-enter");
      cur.classList.add("replay-reset");
      void cur.offsetWidth;

      requestAnimationFrame(() => {
        cur.classList.remove("replay-reset");
        void cur.offsetWidth;
        cur.classList.add("is-enter");
        requestAnimationFrame(applyFit);
      });
    }

    function activate(i){
      const prev = slides[idx];
      idx = (i + slides.length) % slides.length;
      const next = slides[idx];

      prev.classList.remove("is-enter","is-active");

      next.classList.add("is-active");
      next.classList.remove("is-enter");
      void next.offsetWidth;
      next.classList.add("is-enter");

      requestAnimationFrame(applyFit);
    }

    function next(){ activate(idx + 1); }
    function prev(){ activate(idx - 1); }

    // init
    slides[0].classList.add("is-active","is-enter");
    requestAnimationFrame(applyFit);
    window.addEventListener("resize", () => requestAnimationFrame(applyFit));

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (!document.fullscreenElement) return;
      next();
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      if (!document.fullscreenElement) return;
      prev();
    });

    // ===== Auto play =====
    let isAuto = false;
    let autoTimer = null;
    const AUTO_INTERVAL = 3000;

    const autoBtn = document.getElementById("autoBtn");
    autoBtn.textContent = "OFF";

    function startAuto(){
      if (!document.fullscreenElement) return;
      isAuto = true;
      autoBtn.textContent = "ON";
      autoTimer = setInterval(next, AUTO_INTERVAL);
    }
    function stopAuto(){
      isAuto = false;
      autoBtn.textContent = "OFF";
      if (autoTimer) clearInterval(autoTimer);
      autoTimer = null;
    }

    autoBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) return;
      isAuto ? stopAuto() : startAuto();
    });

    // ===== Fullscreen（必須 user gesture）=====
    function enterFullscreenByGesture(){
      if (document.fullscreenElement) return;
      document.documentElement.requestFullscreen()
        .then(() => setTimeout(replayCurrentSlide, 120))
        .catch(err => console.warn("Fullscreen failed:", err));
    }

    function exitFullscreen(){
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(()=>{});
      }
    }

    // 點一下進全螢幕
    window.addEventListener("pointerdown", () => {
      if (!document.fullscreenElement) enterFullscreenByGesture();
    });

    // 鍵盤：非全螢幕先進全螢幕；全螢幕才翻頁
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        stopAuto();
        exitFullscreen();
        return;
      }

      if (!document.fullscreenElement) {
        e.preventDefault();
        enterFullscreenByGesture();
        return;
      }

      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
      if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
    });

    document.addEventListener("fullscreenchange", () => {
      requestAnimationFrame(applyFit);
      if (document.fullscreenElement) setTimeout(replayCurrentSlide, 120);
      else stopAuto();
    });

    // ===== Slide 0：點擊圈圈進下一頁 =====
    document.addEventListener("DOMContentLoaded", () => {
      const slide0 = document.querySelector('[data-slide]');
      const circle = slide0?.querySelector('.swap-circle');

      if (!circle) return;

      circle.addEventListener('click', (e) => {
        e.stopPropagation(); // ⛔ 不觸發全畫面 pointerdown
        if (!document.fullscreenElement) {
          // 尚未全螢幕：先進全螢幕，再翻頁
          enterFullscreenByGesture();
          setTimeout(next, 300);
        } else {
          next();
        }
      });
    });

    // Wheel navigate（只在全螢幕）
    let wheelLock = false;
    window.addEventListener("wheel", (e) => {
      if (!document.fullscreenElement) return;
      if (wheelLock) return;
      if (Math.abs(e.deltaY) < 10) return;
      wheelLock = true;
      setTimeout(() => wheelLock = false, 450);
      (e.deltaY > 0) ? next() : prev();
    }, { passive:true });
  </script>
</body>
